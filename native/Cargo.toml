[package]
name = "ultimate2-native"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Native Wayland configurator for 8BitDo Ultimate 2 Wireless"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "default_fonts", "accesskit", "clipboard"] }
winit = { version = "0.30", default-features = false, features = ["wayland"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
screenshots = ["dep:image"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
