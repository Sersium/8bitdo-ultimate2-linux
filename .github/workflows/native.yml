name: Native Rust app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate2-native-linux-x86_64
          path: native/target/release/ultimate2-native
